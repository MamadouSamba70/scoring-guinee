version: "3.9"

services:
  # ─── Base de données PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: scoring_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scoring_guinee}
      POSTGRES_USER: ${POSTGRES_USER:-scoring_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoring_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scoring_user} -d ${POSTGRES_DB:-scoring_guinee}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scoring_net

  # ─── Cache Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scoring_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scoring_net

  # ─── Backend FastAPI ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoring_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scoring_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Frontend React ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scoring_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - scoring_net

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: scoring_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - scoring_net

volumes:
  postgres_data:
  redis_data:
  ml_models:

networks:
  scoring_net:
    driver: bridge
